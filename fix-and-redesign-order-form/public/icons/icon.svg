<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0369a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#164e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Outer ring background -->
  <circle cx="100" cy="100" r="95" fill="#f8fafc" stroke="url(#grad1)" stroke-width="2"/>
  
  <!-- Main gradient circle -->
  <circle cx="100" cy="100" r="85" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Inner circle for depth -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Stream/wave symbol -->
  <g transform="translate(100, 100)">
    <!-- Left wave -->
    <path d="M -25 -15 Q -15 -25 -5 -15 Q 5 -5 15 -15" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    
    <!-- Middle wave -->
    <path d="M -30 0 Q -15 -8 0 0 Q 15 8 30 0" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    
    <!-- Right wave -->
    <path d="M -25 15 Q -10 5 5 15 Q 20 25 35 15" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    
    <!-- Central dot/vertex -->
    <circle cx="0" cy="0" r="4" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Highlight/shine effect -->
  <ellipse cx="70" cy="70" rx="20" ry="25" fill="white" opacity="0.15"/>
  
  <!-- Bottom accent bar -->
  <rect x="40" y="140" width="120" height="4" fill="url(#grad2)" rx="2"/>
</svg>