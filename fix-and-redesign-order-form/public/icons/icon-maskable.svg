<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Teal gradient (Stream) -->
    <linearGradient id="tealM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F5E6"/>
      <stop offset="1" stop-color="#00D4C4"/>
    </linearGradient>
    
    <!-- Orange gradient (Vertex) -->
    <linearGradient id="orangeM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB847"/>
      <stop offset="1" stop-color="#FF6B1A"/>
    </linearGradient>
  </defs>
  
  <!-- Left shopping bag (Teal) -->
  <path d="M 120 190 
           L 145 145 
           Q 165 120 200 120 
           L 245 120 
           Q 260 120 260 135 
           L 260 370 
           Q 260 385 245 385 
           L 145 385 
           Q 120 385 120 370 Z" 
        fill="url(#tealM)"/>
  
  <!-- Right shopping bag (Orange) -->
  <path d="M 392 190 
           L 367 145 
           Q 347 120 312 120 
           L 267 120 
           Q 252 120 252 135 
           L 252 370 
           Q 252 385 267 385 
           L 367 385 
           Q 392 385 392 370 Z" 
        fill="url(#orangeM)"/>
  
  <!-- Center accent band -->
  <rect x="254" y="155" width="8" height="220" fill="#ffffff" opacity="0.15" rx="2"/>
  
  <!-- Handle connecting both sides -->
  <path d="M 185 120 Q 256 65 327 120" 
        stroke="url(#tealM)" 
        stroke-width="18" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.8"/>
  
  <!-- Accent circles optimized for maskable display -->
  <circle cx="95" cy="110" r="16" fill="url(#tealM)" opacity="0.6"/>
  <circle cx="417" cy="115" r="14" fill="url(#orangeM)" opacity="0.6"/>
</svg>
